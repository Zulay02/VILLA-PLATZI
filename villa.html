<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Villa Platzi</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 20px;
            color: #111;
            background: #fff;
        }
        .instrucciones {
            margin: 10px 0;
            line-height: 1.6;
        }
        kbd {
            display: inline-block;
            padding: 2px 8px;
            border: 2px solid #111;
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Villa Platzi</h1>
    <p class="instrucciones">
        🐷 Mueve el <strong>cerdo</strong> con las flechas
        <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd><br>
        🐺 Mueve el <strong>lobo</strong> con las letras
        <kbd>W</kbd> <kbd>S</kbd> <kbd>A</kbd> <kbd>D</kbd>
    </p>
    <canvas width="500" height="500" id="villaplatzi"></canvas>
    <script src="platzi.js"></script>
</body>
</html>
