<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Villa Platzi</title>
    <style>
        body {
            margin: 0;
            padding: 16px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 20px;
            color: #111;
            background: #fff;
        }
        h1 {
            margin: 0 0 10px;
        }
        .niveles {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }
        button {
            font-size: 18px;
            font-weight: bold;
            padding: 10px 16px;
            border: 3px solid #111;
            border-radius: 8px;
            background: #ffe9a8;
            color: #111;
            cursor: pointer;
        }
        button:hover,
        button:focus {
            background: #ffd34d;
        }
        button.activo {
            background: #111;
            color: #fff;
        }
        #instrucciones {
            margin: 0 0 8px;
            line-height: 1.5;
            max-width: 500px;
        }
        #estado {
            margin: 0 0 8px;
            font-size: 24px;
            font-weight: bold;
        }
        canvas {
            display: block;
            max-width: 100%;
            border: 3px solid #111;
        }
        kbd {
            display: inline-block;
            padding: 1px 7px;
            border: 2px solid #111;
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Villa Platzi</h1>

    <div class="niveles">
        <button id="nivel1">1. El lobo persigue al cerdo</button>
        <button id="nivel2">2. Rescata a los pollitos</button>
        <button id="nivel3">3. Junta el rebaño</button>
    </div>

    <p id="instrucciones">Elige un nivel para empezar.</p>
    <p id="estado"></p>

    <canvas width="500" height="500" id="villaplatzi"></canvas>

    <script src="platzi.js"></script>
</body>
</html>
